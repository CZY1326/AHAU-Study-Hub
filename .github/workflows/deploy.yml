name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 向 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整历史

      # 项目只有一个依赖（vitepress），直接用 Node 自带的 npm，
      # 避免 pnpm/corepack 在 CI 上互相干扰导致的安装故障。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Diagnose toolchain
        continue-on-error: true
        run: |
          echo "== node =="; node -v
          echo "== npm =="; npm -v
          echo "== which npm =="; which npm
          echo "== lockfile =="; head -5 package-lock.json

      - name: Install dependencies
        run: npm ci

      # 单文件 >= 50 MB 不进仓库（约定），超限直接失败并列出文件
      - name: Check file sizes
        run: npm run checksize

      # 部署前需要 Pages 的站点信息（basePath / page_url 等环境变量）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 根据课程目录里的真实文件，刷新每门课的资料清单
      - name: Generate course file lists
        run: npm run files

      - name: Build site
        run: npm run docs:build

      # VitePress 只发布 public/ 下的静态资源，
      # 课程目录里的 PDF / PPT 需要显式复制进构建产物，否则下载链接会 404
      - name: Copy course assets into dist
        run: npm run files:copy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
