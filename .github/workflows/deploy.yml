name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 向 Pages 部署
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留最新一次部署，避免并发互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要完整历史

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.9 # 显式指定，避免依赖 packageManager 解析
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Node 20 默认启用 corepack，它会依据 packageManager 字段自行下载 pnpm，
      # 与上面 pnpm/action-setup 安装的 pnpm 冲突（曾导致 install 步骤秒挂）。
      # 这里显式关闭 corepack，统一使用 action-setup 提供的 pnpm。
      - name: Disable corepack
        run: corepack disable || true

      - name: Diagnose toolchain
        run: |
          echo "== node =="
          node -v
          echo "== which pnpm =="
          which pnpm || true
          echo "== pnpm version =="
          pnpm -v
          echo "== lockfile head =="
          head -5 pnpm-lock.yaml
          echo "== files present =="
          ls -la package.json pnpm-lock.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=append-only

      # 部署前需要 Pages 的站点信息（basePath / page_url 等环境变量）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 根据课程目录里的真实文件，刷新每门课的资料清单
      - name: Generate course file lists
        run: pnpm files

      - name: Build site
        run: pnpm docs:build

      # VitePress 只发布 public/ 下的静态资源，
      # 课程目录里的 PDF / PPT 需要显式复制进构建产物，否则下载链接会 404
      - name: Copy course assets into dist
        run: pnpm files:copy

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
